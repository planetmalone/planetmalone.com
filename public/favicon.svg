<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 -3.5 60 60">
  <!-- The Planet Malone mark (design/assets/logo-mark-green.svg), switching to the
       dark-mode mark (logo-mark-dark.svg) when the browser is dark. -->
  <style>
    .planet { fill: #c4461c; }
    .outline { stroke: #2a1f18; }
    .texture { stroke: #2a1f18; opacity: .45; }
    .ring { stroke: #2a1f18; }
    .moon { fill: #3f7a4a; }
    @media (prefers-color-scheme: dark) {
      .planet { fill: #ff8a5b; }
      .outline { stroke: #16120e; }
      .texture { stroke: #16120e; opacity: .35; }
      .ring { stroke: #f4ece0; }
      .moon { fill: #8fcb9c; }
    }
  </style>
  <defs>
    <filter id="r" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
  </defs>
  <g filter="url(#r)" fill="none" stroke-linecap="round">
    <circle class="planet outline" cx="32" cy="32" r="17" stroke-width="2.4"/>
    <path class="texture" d="M20 26 C26 24 30 28 36 26 M22 38 C28 36 34 40 42 37" stroke-width="2"/>
    <path class="ring" d="M8 40 C4 34 20 24 34 20 C48 16 60 18 58 24" stroke-width="2.4"/>
    <path class="ring" d="M58 24 C56 30 44 36 30 40 C18 44 10 44 8 40" stroke-width="2.4"/>
    <circle class="moon outline" cx="54" cy="12" r="3.2" stroke-width="2"/>
  </g>
</svg>
