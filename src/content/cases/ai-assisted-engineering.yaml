title: AI-assisted engineering, done responsibly
shortTitle: AI-assisted engineering
tags: [Strategy, People]
company: Aspira
years: { start: 2025, end: 2026 }
summary: Started the agent-skills program and a weekly AI docs pipeline that only publishes after a human reviews the PR.
metric: Used by ~20 engineers
role: Staff Frontend Engineer, program lead
team: { label: Reach, value: ~20 engineers }

context:
  text: |-
    As a team, we were learning how to adapt our development workflows to the new AI era. Each of us had our own ideas of how to best leverage our agents, but this resulted in inconsistencies and standards drift. We already tackled the easy stuff with linting and formatting. The hard stuff was patterns, component architecture, accessibility, testing strategies, and more. With each of us doing our own thing, agents struggled to find exemplars to build upon.

    We became more comfortable working with agents and began letting them do more. AI is far from perfect, and it made plenty of mistakes. We grew complacent about reviews, more bugs slipped in, and overall quality started taking a back seat to speed. We needed to regroup.

    AI is an accelerator, but every line still gets a human review. The program was built around that rule.

scope:
  - Started the team's AI agent-skills program and wrote 11 of its 22 skills.
  - Grounded each skill in a codebase audit and checked it with fresh-agent runs.
  - Built an AI documentation pipeline that updates weekly and publishes only after a human reviews the PR.

decisions:
  cards:
    - label: Guardrail
      title: Audit first
      body: Every skill starts from a codebase audit, not a guess about the codebase.
    - label: Review
      title: Review differently
      body: Every line still gets reviewed. The diff is regrouped by concept instead of by file.

people:
  topics:
    - heading: Agent skills
      text: |-
        We found the best way to make agents repeatable regardless of harness was to introduce shared skills. To make creation easier, I first created a skill-authoring skill. An engineer writing a new skill is prompted with questions until the skill has enough information to begin writing it. Once the engineer approves the skill, it is tested. Three models are each given a test prompt with the skill, and each model's performance is evaluated.

        The program started with getting every engineer involved. We have a weekly Frontend Discussion meeting where a variety of topics are brought up. I brought up the idea of shared skills, and as a team we discussed which skills to create and what they should contain. From that discussion, I led a small group of engineers to create the skills. Once they were complete, I announced them to the team.

        We identified 22 skills that would guide agents as they coded, and I wrote 11 of them. These skills are used by every engineer on the NextGen platform, and the backend team is adopting the approach. Consistency has improved, fewer bugs slip through, and engineers are more efficient in their agentic flows.
    - heading: Concept-based reviews
      text: |-
        A traditional code diff lists files in an arbitrary order, usually alphabetical. As AI writes more code, diffs get larger, and reviewing them the old way is no longer tenable. I call my fix concept-based reviews. They center on the changing concepts, not the changing code. It is still a code review, and every line gets reviewed. The structure and flow are what change. The diff is broken into concepts, with the relevant code shown under each. Take a flow that adds a new form and makes an API request: every line relevant to that flow shows up in that section. Other lines in the same files don't appear there. They show up under the concept that fits their purpose.

        It began as a process, and I later turned it into a skill that tells the agent to format reviews this way. Reviewers understand the change far better, and by my own measurements a 1,000-line review dropped from 20-30 minutes to about 5. Since I introduced it, about half the team has adopted it, with more adding it to their workflow.

