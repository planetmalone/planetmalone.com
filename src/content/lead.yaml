columns:
  - heading: As an IC leader
    principles:
      - title: Write the decision down
        description: ADRs and short RFCs travel further than meetings, and they outlast me being in the room.
      - title: Make the right way the easy way
        description: Design systems, lint rules and agent skills that encode the standard so nobody has to remember it.
      - title: Stay in the code
        description: I review, pair and ship. Strategy that never touches a PR tends to stay a slide.
  - heading: As a manager
    principles:
      - title: 1:1s happen
        description: Weekly with my direct reports, every other week with skip-levels. At Stellar Elements the cadence went from under 50% to 100%.
      - title: Say the expectation out loud
        description: Career frameworks and OKRs that people can read, so growth isn't a guessing game.
      - title: Hire, then get out of the way
        description: Built Redibs' team from 0 to 8, then made myself the least necessary person on it.
